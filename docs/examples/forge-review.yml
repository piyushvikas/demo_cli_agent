# Example: Forge PR Review
# Copy this file to your repo: .github/workflows/forge-review.yml
#
# This enables automatic AI code review on every pull request.
# Forge explores your codebase using terminal commands (git, grep, etc.)
# and posts detailed review comments.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  acknowledge:
    runs-on: ubuntu-latest
    steps:
      - name: React with eyes emoji
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              content: 'eyes'
            });
      - name: Post acknowledgment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Forge is reviewing this PR...'
            });

  review:
    needs: acknowledge
    uses: parallelum-tech/ops-factory/.github/workflows/forge-review.yml@v1
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
