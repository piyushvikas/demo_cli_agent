name: Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: 'gitleaks release version to install'
        required: false
        type: string
        default: '8.21.2'

jobs:
  scan:
    # Deterministic secret/credential scanning — a real rule-based tool, not
    # an LLM. Complements Forge's review rather than relying on it to catch
    # hardcoded secrets/env-var leaks (Forge is not a dedicated scanner).
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history so gitleaks can scan past commits too

    - name: Install gitleaks
      shell: bash
      run: |
        VERSION="${{ inputs.gitleaks_version }}"
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
          | tar xz gitleaks
        sudo mv gitleaks /usr/local/bin/
        gitleaks version

    - name: Write gitleaks config
      shell: bash
      run: |
        cat > /tmp/gitleaks.toml << 'EOF'
        [extend]
        # Keep gitleaks' built-in rules (AWS keys, GitHub tokens, Stripe, etc.)
        useDefault = true

        [[rules]]
        # The default ruleset targets known token FORMATS and high-entropy
        # random strings — it does not reliably catch a plain, human-readable
        # hardcoded credential like password = "MyPassword123!". This rule
        # closes that gap: any credential-shaped variable name assigned a
        # quoted string literal, regardless of randomness.
        id = "hardcoded-credential-assignment"
        description = "Hardcoded credential-like variable assigned a string literal"
        regex = '''(?i)(password|passwd|pwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|db[_-]?password|private[_-]?key)\s*[:=]\s*["'][^"'\s]{6,}["']'''
        tags = ["credentials", "generic", "custom"]
        EOF

    - name: Run gitleaks scan
      shell: bash
      run: gitleaks detect --source . --config /tmp/gitleaks.toml --verbose --redact --exit-code 1
